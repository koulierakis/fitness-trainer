name: Functional QA
# shared-catalog-v1
on:
  push:
    branches: [main, work/functional-gif-library, work/functional-full-1500-gif-catalog, work/functional-200-curated, work/reformer-functional-library-v1, work/reformer-browser-qa-final]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - name: Catalog data QA
        run: npm run validate:catalog
      - name: Install browser smoke dependency
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Real browser smoke QA
        run: node scripts/browser-smoke.mjs
      - name: Verify 3D assets
        run: npm run verify:3d
      - name: Curated Functional media QA
        run: |
          node --input-type=module -e "Promise.all([import('./src/data.js'),import('./src/curatedMediaMap.js')]).then(([d,m])=>{if(d.exercises.length!==201)throw new Error('Expected 201 curated exercises');const ids=new Set(d.exercises.map(x=>x.id));for(const id of Object.keys(m.CURATED_GIF_NAME_MAP))if(!ids.has(id))throw new Error('Unknown curated media id: '+id);console.log('Curated exercises:',d.exercises.length,'reviewed GIF aliases:',Object.keys(m.CURATED_GIF_NAME_MAP).length)})"
      - name: Functional program QA
        run: |
          node --input-type=module -e "import('./src/programs60.js').then(m=>{if(!m.validatePrograms())process.exit(1);console.log('Programs:',m.programs.length,'all 3600s')})"
      - name: Animated GIF taxonomy QA
        run: |
          node --input-type=module -e "import('./src/dataset.js').then(m=>{const x=m.toFitnessExercise({exerciseId:'qa1',name:'dumbbell thruster',bodyParts:['upper arms'],targetMuscles:['triceps'],equipments:['dumbbell'],instructions:['Control the movement'],secondaryMuscles:[],gifUrl:'https://example.com/demo.gif'});if(x.level!=='Advanced'||x.equipment!=='Dumbbells'||x.group!=='Χέρια'||x.media.type!=='animated-gif')process.exit(1);const s=m.toFitnessExercise({exerciseId:'qa2',name:'hamstring stretch',bodyParts:['upper legs'],targetMuscles:['hamstrings'],equipments:['body weight'],instructions:['Hold'],gifUrl:'https://example.com/stretch.gif'});if(s.group!=='Stretching'||s.goal!=='Stretching')process.exit(1);console.log('GIF taxonomy OK')})"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install visual pipeline dependencies
        run: python -m pip install -r requirements-visual.txt
      - name: Visual pipeline unit tests
        run: |
          python -m unittest tests.test_visual_pipeline
          python -m pytest -q test_runware_pipeline.py
