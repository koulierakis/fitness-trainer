name: Visual Pipeline Tests

on:
  push:
    branches: [main]
    paths:
      - "run_generator.py"
      - "src/visuals/**"
      - "test_runware_pipeline.py"
      - "requirements-visual.txt"
      - ".github/workflows/visual-pipeline-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-visual.txt
      - run: python -m pytest -q test_runware_pipeline.py
      - name: Validate pilot manifest without API key
        run: |
          python - <<'PY'
          from run_generator import manifest_tasks, validate_tasks
          tasks=manifest_tasks("src/visuals/exercise-visual-manifest.json")
          ids=list(dict.fromkeys(t["exercise_id"] for t in tasks))
          assert len(ids)==10, len(ids)
          assert len(tasks)==30, len(tasks)
          errors=validate_tasks(tasks)
          pose=[e for e in errors if "pose/control" in e]
          repdb=[e for e in errors if "RepDB" in e]
          character=[e for e in errors if "character reference/LoRA" in e]
          assert not pose, pose
          assert not repdb, repdb
          assert len(character)==30, len(character)
          print("Pilot structure OK: 10 exercises / 30 frames / 30 deterministic pose controls.")
          print("Expected blocker before paid generation: 30 character-conditioning references.")
          PY
